name: Frontend CI/CD - GCP

on:
  push:
    branches: [ main, develop ] # Agregamos develop
    paths:
      - 'stocks-frontend/**'
      - '.github/workflows/frontend.yml'

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO || 'stocks-backend' }}
  # SERVICE: stocks-frontend-service <-- ELIMINADO (ahora es dinámico)
  IMAGE_NAME: stocks-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: stocks-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- CONFIGURACIÓN DINÁMICA DE AMBIENTES ---
      - name: Set Environment for Branch
        id: env-config
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "Ambiente: PRODUCCION"
            echo "SERVICE_NAME=stocks-frontend-service" >> $GITHUB_ENV
            echo "CHOSEN_BACKEND_URL=${{ vars.BACKEND_URL }}" >> $GITHUB_ENV
            echo "ENV_LABEL=production" >> $GITHUB_ENV
          else
            echo "Ambiente: QA"
            echo "SERVICE_NAME=stocks-frontend-service-qa" >> $GITHUB_ENV
            echo "CHOSEN_BACKEND_URL=${{ vars.BACKEND_URL_QA }}" >> $GITHUB_ENV
            echo "ENV_LABEL=qa" >> $GITHUB_ENV
          fi

      - name: Auth to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
        working-directory: .

      - name: Build & Push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          
          echo "🔨 Building image with BACKEND_URL: ${{ env.CHOSEN_BACKEND_URL }}"
          
          docker build \
            --build-arg BACKEND_URL="${{ env.CHOSEN_BACKEND_URL }}" \
            --tag "${IMAGE_URI}" \
            --tag "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:latest" \
            .
          
          echo "📦 Pushing image..."
          docker push "${IMAGE_URI}"
          docker push "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:latest"
          
          # Obtener digest para deploy inmutable
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE_URI}" --format='value(image_summary.digest)')
          echo "IMAGE_URI_DIGEST=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}@${DIGEST}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        working-directory: .
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --image "${IMAGE_URI_DIGEST}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 5 \
            --timeout 10 \
            --concurrency 80 \
            --cpu-boost \
            --labels "app=stocks-frontend,env=${{ env.ENV_LABEL }},tier=frontend"

      - name: Verify deployment
        working-directory: .
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')
          
          echo "🌐 Service URL: ${SERVICE_URL}"
          
          # Esperar que esté listo
          sleep 10
          
          # Health check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health")
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed (HTTP ${HTTP_CODE})"
            # No hacemos exit 1 aquí para no romper el pipeline si el endpoint /health no existe en el frontend
            # exit 1 
          fi
          
          # Verificar index.html
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/")
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Frontend is serving!"
          else
            echo "❌ Frontend not responding (HTTP ${HTTP_CODE})"
            exit 1
          fi

      - name: Display deployment info
        working-directory: .
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --format='value(status.url)')
          
          echo ""
          echo "🎉 =================================="
          echo "   Frontend Deployed Successfully!"
          echo "   =================================="
          echo ""
          echo "🌐 Frontend URL: ${SERVICE_URL}"
          echo "🔗 Backend URL: ${{ env.CHOSEN_BACKEND_URL }}"
          echo "📦 Image: ${IMAGE_URI_DIGEST}"
          echo ""
