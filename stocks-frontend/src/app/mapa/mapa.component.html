<h2>Mapa de plazas y módulos</h2>

<div class="map-controls">
  <label>Plazas en Bogotá:</label>
  <div class="plaza-list">
    <button *ngFor="let p of plazas" (click)="selectPlaza(p)" [class.active]="selected?.name===p.name">{{ p.name }}</button>
  </div>
</div>

<div style="height:420px;width:100%">
  <iframe
    width="100%"
    height="420"
    frameborder="0"
    style="border:0"
    [src]="mapUrl"
    allowfullscreen>
  </iframe>
</div>
